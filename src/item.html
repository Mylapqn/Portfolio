<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{TITLE}} — {{SITE_NAME}}</title>
    <link rel="canonical" href="{{CANONICAL_URL}}">

    <meta property="og:type" content="article">
    <meta property="og:title" content="{{TITLE_ATTR}}">
    <meta property="og:description" content="{{SUMMARY_ATTR}}">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    {{OG_IMAGE}}
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="{{BASE_PATH}}/style.css?v={{VERSION}}">
    <link rel="stylesheet" href="{{BASE_PATH}}/styles/page-colors.css?v={{VERSION}}">
</head>

<body class="{{PAGE_CLASS}}">
    {{SITE_NAV}}

    {{WORK_COVER_HTML}}

    <header class="work-heading">
        <div class="heading-content fixed-width">
            <p class="work-date">{{DATE_LABEL}}</p>
            <h1 class="article-title">{{TITLE}}</h1>
            <div class="work-tags">{{TAG_LINKS_HTML}}</div>
            <div class="item-nav">
                {{EXTERNAL_LINK_HTML}}
            </div>
        </div>
    </header>
    <main class="detail-main fixed-width" role="main">
        {{EMBED_HTML}}
        <div class="article-content">
            {{CONTENT}}
        </div>
    </main>

    <dialog class="image-viewer" aria-label="Full-size image">
        <button class="image-viewer-close" type="button" aria-label="Close image">&times;</button>
        <img alt="" draggable="false">
    </dialog>
    <script>
        const viewer = document.querySelector('.image-viewer');
        const viewerImage = viewer.querySelector('img');
        const closeButton = viewer.querySelector('.image-viewer-close');
        const activePointers = new Map();
        let zoom = 1;
        let panX = 0;
        let panY = 0;
        let dragStart = null;
        let pinchStartDistance = 0;
        let pinchStartZoom = 1;
        let savedScrollY = 0;
        let returnFocus = null;

        /** Keeps the zoomed image within the viewer bounds. */
        function constrainPan() {
            const imageWidth = viewerImage.clientWidth;
            const imageHeight = viewerImage.clientHeight;
            if (!imageWidth || !imageHeight || !viewerImage.naturalWidth || !viewerImage.naturalHeight) {
                panX = 0;
                panY = 0;
                return;
            }

            const imageRatio = viewerImage.naturalWidth / viewerImage.naturalHeight;
            const boxRatio = imageWidth / imageHeight;
            const fittedWidth = imageRatio > boxRatio ? imageWidth : imageHeight * imageRatio;
            const fittedHeight = imageRatio > boxRatio ? imageWidth / imageRatio : imageHeight;
            const maxPanX = Math.max(0, (fittedWidth * zoom - viewer.clientWidth) / 2);
            const maxPanY = Math.max(0, (fittedHeight * zoom - viewer.clientHeight) / 2);
            panX = Math.min(maxPanX, Math.max(-maxPanX, panX));
            panY = Math.min(maxPanY, Math.max(-maxPanY, panY));
        }

        /** Applies the current pan and zoom to the viewer image. */
        function renderImageTransform() {
            viewerImage.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
        }

        /** Applies a bounded zoom level to the viewer image. */
        function setZoom(value) {
            zoom = Math.min(4, Math.max(1, value));
            constrainPan();
            viewerImage.classList.toggle('is-zoomed', zoom > 1);
            renderImageTransform();
        }

        /** Starts a drag from the current pointer and pan positions. */
        function startDrag(pointer) {
            dragStart = { x: pointer.x, y: pointer.y, panX, panY };
        }

        /** Returns the distance between the two active touch pointers. */
        function getPinchDistance() {
            const points = Array.from(activePointers.values());
            if (points.length < 2) return 0;
            return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        }

        /** Opens the fullscreen viewer and remembers the page position to restore later. */
        function openViewer(image) {
            savedScrollY = window.scrollY;
            returnFocus = image;
            viewerImage.src = image.currentSrc || image.src;
            viewerImage.alt = image.alt;
            panX = 0;
            panY = 0;
            dragStart = null;
            viewerImage.style.transition = '';
            viewer.showModal();
            setZoom(1);
            closeButton.focus({ preventScroll: true });
        }

        /** Restores focus and the exact page position after the viewer closes. */
        function restorePagePosition() {
            if (returnFocus) returnFocus.focus({ preventScroll: true });
            window.scrollTo(0, savedScrollY);
            returnFocus = null;
        }

        document.querySelectorAll('.destination-icon').forEach((icon) => {
            const showFallback = () => {
                icon.hidden = true;
                icon.nextElementSibling.hidden = false;
            };
            icon.addEventListener('error', showFallback, { once: true });
            if (icon.complete && icon.naturalWidth === 0) showFallback();
        });
        document.querySelectorAll('.article-content img, .work-cover img').forEach((image) => {
            image.draggable = false;
            image.tabIndex = 0;
            image.setAttribute('role', 'button');
            image.setAttribute('aria-label', `View full-size image: ${image.alt || 'image'}`);
            image.addEventListener('click', () => {
                openViewer(image);
            });
            image.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    image.click();
                }
            });
        });
        closeButton.addEventListener('click', () => viewer.close());
        viewer.addEventListener('close', restorePagePosition);
        viewer.addEventListener('click', (event) => {
            if (event.target === viewer) viewer.close();
        });
        viewerImage.addEventListener('wheel', (event) => {
            event.preventDefault();
            setZoom(zoom + (event.deltaY < 0 ? 0.1 : -0.1));
        }, { passive: false });
        viewerImage.addEventListener('dragstart', (event) => {
            event.preventDefault();
        });
        viewerImage.addEventListener('pointerdown', (event) => {
            if (event.pointerType !== 'touch' && (event.button !== 0 || zoom <= 1)) return;
            viewerImage.setPointerCapture(event.pointerId);
            activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
            if (activePointers.size === 2) {
                pinchStartDistance = getPinchDistance();
                pinchStartZoom = zoom;
                dragStart = null;
                viewerImage.classList.remove('is-dragging');
                viewerImage.style.transition = 'none';
            } else if (zoom > 1) {
                startDrag({ x: event.clientX, y: event.clientY });
                viewerImage.classList.add('is-dragging');
                viewerImage.style.transition = 'none';
            }
        });
        viewerImage.addEventListener('pointermove', (event) => {
            if (!activePointers.has(event.pointerId)) return;
            activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
            if (activePointers.size >= 2 && pinchStartDistance > 0) {
                event.preventDefault();
                setZoom(pinchStartZoom * getPinchDistance() / pinchStartDistance);
                return;
            }
            if (activePointers.size === 1 && dragStart) {
                event.preventDefault();
                panX = dragStart.panX + event.clientX - dragStart.x;
                panY = dragStart.panY + event.clientY - dragStart.y;
                constrainPan();
                renderImageTransform();
            }
        });
        const finishPointer = (event) => {
            activePointers.delete(event.pointerId);
            if (activePointers.size < 2) {
                pinchStartDistance = 0;
                viewerImage.style.transition = '';
            }
            if (activePointers.size === 1 && zoom > 1) {
                const pointer = activePointers.values().next().value;
                startDrag(pointer);
                viewerImage.classList.add('is-dragging');
                viewerImage.style.transition = 'none';
            } else {
                dragStart = null;
                viewerImage.classList.remove('is-dragging');
            }
        };
        viewerImage.addEventListener('pointerup', finishPointer);
        viewerImage.addEventListener('pointercancel', finishPointer);
        window.addEventListener('resize', () => {
            constrainPan();
            renderImageTransform();
        });
    </script>
</body>

</html>
